<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#183a32">
    <title>Mall Concierge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/styles.css" rel="stylesheet">
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand-lockup" href="/" aria-label="Mall Concierge home">
          <span class="brand-mark"><i class="bi bi-bag-heart-fill" aria-hidden="true"></i></span>
          <span class="brand-name">MALL<span> / </span>CONCIERGE</span>
        </a>
        <div id="service-status" class="service-status" role="status">
          <span class="status-dot"></span>
          <span id="service-status-text">Connecting</span>
        </div>
      </header>

      <main class="container chat-layout">
        <section class="chat-surface" aria-label="Shopping assistant chat">
          <div class="chat-heading">
            <div>
              <div class="eyebrow">SHOPPING MALL SERVICE</div>
              <h1>Mall concierge</h1>
            </div>
            <button id="new-chat" class="btn btn-outline-dark new-chat-button" type="button" title="Start a new conversation">
              <i class="bi bi-plus-lg" aria-hidden="true"></i>
              <span>New chat</span>
            </button>
          </div>

          <div class="account-row">
            <div class="session-label">SHOPPER SESSION</div>
            <div class="session-summary" role="status" aria-live="polite">
              <span class="session-icon"><i class="bi bi-person-check-fill" aria-hidden="true"></i></span>
              <span><strong>Guest shopper</strong><small id="session-state">Preparing your account...</small></span>
            </div>
          </div>

          <div id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions text">
            <div class="welcome-message">
              <span class="welcome-mark"><i class="bi bi-stars" aria-hidden="true"></i></span>
              <div>
                <h2>What are you looking for?</h2>
                <p>Ask about a product, an order, or your seller account.</p>
              </div>
            </div>
          </div>

          <div class="suggestions" aria-label="Suggested messages">
            <button class="suggestion" type="button" data-prompt="Recommend a blue shirt">Find a blue shirt</button>
            <button class="suggestion" type="button" data-prompt="Check my order status">Check an order</button>
            <button class="suggestion" type="button" data-prompt="Show my sales records">View sales</button>
          </div>

          <form id="chat-form" class="composer">
            <label class="visually-hidden" for="message-input">Message</label>
            <textarea id="message-input" class="form-control" rows="1" maxlength="10000" placeholder="Write a message..." required></textarea>
            <button id="send-button" class="btn send-button" type="submit" aria-label="Send message" title="Send message">
              <i class="bi bi-arrow-up" aria-hidden="true"></i>
            </button>
          </form>
          <div class="composer-note">Mall Concierge <span>·</span> Shopping assistance</div>
        </section>
      </main>
    </div>
    <script src="/app.js" defer></script>
  </body>
</html>
