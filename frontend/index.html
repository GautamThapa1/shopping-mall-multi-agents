<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#183a32">
    <title>Mall Concierge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/styles.css" rel="stylesheet">
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand-lockup" href="/" aria-label="Mall Concierge home">
          <span class="brand-mark"><i class="bi bi-bag-heart-fill" aria-hidden="true"></i></span>
          <span class="brand-name">MALL<span> / </span>CONCIERGE</span>
        </a>
      </header>

      <main class="container chat-layout">
        <section class="chat-surface" aria-label="Shopping assistant chat">
          <div class="chat-heading">
            <div>
              <div class="eyebrow">SHOPPING MALL SERVICE</div>
              <h1 id="mode-title">Shop</h1>
            </div>
            <button id="new-chat" class="btn btn-outline-dark new-chat-button" type="button" title="Start a new conversation">
              <i class="bi bi-plus-lg" aria-hidden="true"></i>
              <span>New chat</span>
            </button>
          </div>

          <div class="role-switch" role="tablist" aria-label="Choose your workspace">
            <button id="shopper-tab" class="role-tab active" type="button" role="tab" aria-selected="true" data-role="shopper">
              <i class="bi bi-bag" aria-hidden="true"></i>
              <span>Shop</span>
            </button>
            <button id="shopkeeper-tab" class="role-tab" type="button" role="tab" aria-selected="false" data-role="shopkeeper">
              <i class="bi bi-shop" aria-hidden="true"></i>
              <span>Shopkeeper</span>
            </button>
          </div>

          <div class="account-row">
            <div id="shopper-session" class="session-summary" role="status" aria-live="polite">
              <span class="session-icon"><i class="bi bi-person-check-fill" aria-hidden="true"></i></span>
              <span><strong>Guest shopper</strong><small id="shopper-session-state">Preparing your account...</small></span>
            </div>
            <form id="shopkeeper-login" class="shopkeeper-login" hidden>
              <label for="shopkeeper-id">Shopkeeper ID</label>
              <input id="shopkeeper-id" class="form-control" type="text" maxlength="128" autocomplete="username" placeholder="Enter your shopkeeper ID" required>
              <button id="shopkeeper-connect" class="btn shopkeeper-connect" type="submit">Connect</button>
              <span id="shopkeeper-session-state" class="session-feedback" role="status" aria-live="polite">Use your existing vendor account.</span>
            </form>
            <div id="shopkeeper-session" class="session-summary" role="status" aria-live="polite" hidden>
              <span class="session-icon"><i class="bi bi-shop-window" aria-hidden="true"></i></span>
              <span><strong>Shopkeeper account</strong><small id="shopkeeper-ready-state">Connected</small></span>
              <button id="shopkeeper-change" class="btn change-shopkeeper" type="button" title="Change shopkeeper ID">
                <i class="bi bi-arrow-repeat" aria-hidden="true"></i>
                <span>Change ID</span>
              </button>
            </div>
          </div>

          <div id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions text">
            <div class="welcome-message">
              <span class="welcome-mark"><i class="bi bi-stars" aria-hidden="true"></i></span>
              <div>
                <h2>What are you looking for?</h2>
                  <p>Find products, place orders, or check a purchase.</p>
              </div>
            </div>
          </div>

          <div class="suggestions" aria-label="Suggested messages">
            <button class="suggestion" type="button" data-role="shopper" data-prompt="Recommend Puma shoes">Find Puma shoes</button>
            <button class="suggestion" type="button" data-role="shopper" data-prompt="Check my order status">Check an order</button>
            <button class="suggestion" type="button" data-role="shopper" data-prompt="Cancel my order">Cancel an order</button>
            <button class="suggestion" type="button" data-role="shopkeeper" data-prompt="Show my sales records">View sales</button>
            <button class="suggestion" type="button" data-role="shopkeeper" data-prompt="Show my inventory with listing IDs and stock levels">View inventory</button>
            <button class="suggestion" type="button" data-role="shopkeeper" data-prompt="Show my recent customer orders">Recent orders</button>
            <button class="suggestion" type="button" data-role="shopkeeper" data-prompt="Help me update a purchase shipping status">Update order status</button>
            <button class="suggestion" type="button" data-role="shopkeeper" data-prompt="Help me restock a product">Restock</button>
          </div>

          <form id="chat-form" class="composer">
            <label class="visually-hidden" for="message-input">Message</label>
            <textarea id="message-input" class="form-control" rows="1" maxlength="10000" placeholder="Write a message..." required></textarea>
            <button id="send-button" class="btn send-button" type="submit" aria-label="Send message" title="Send message">
              <i class="bi bi-arrow-up" aria-hidden="true"></i>
            </button>
          </form>
          <div class="composer-note">Mall Concierge <span>·</span> Shopping assistance</div>
        </section>
      </main>
    </div>
    <script src="/app.js" defer></script>
  </body>
</html>
